<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3e8ff">
  <meta name="description" content="momoooo - คลังชีทสรุปและควิซ สอวน. วิทยาศาสตร์โลกและอวกาศ">
  <title>momoooo — สอวน. วิทยาศาสตร์โลกและอวกาศ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Fredoka:wght@500;600;700&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="auroraCanvas" aria-hidden="true"></canvas>
  <div class="aurora-bg" aria-hidden="true">
    <span class="cloud cloud-one"></span>
    <span class="cloud cloud-two"></span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <button id="homeBrand" class="brand" type="button" aria-label="กลับหน้าแรก">momoooo <span>✦</span></button>
      <nav class="main-nav" aria-label="เมนูหลัก">
        <button id="libraryNav" class="nav-tab active" type="button" data-view="library">คลังเนื้อหา</button>
        <button id="quizNav" class="nav-tab" type="button" data-view="quiz">ฝึกทำควิซ</button>
      </nav>
      <span id="adminBadge" class="admin-badge" hidden>ADMIN MODE</span>
    </div>
  </header>

  <main id="app" class="main-container"></main>

  <div id="adminActions" class="admin-actions" hidden>
    <button id="addContentButton" class="floating-action" type="button">+ เพิ่มเนื้อหา</button>
    <button id="addQuizButton" class="floating-action quiz-action" type="button">+ เพิ่มโจทย์ควิซ</button>
  </div>

  <div id="contentModal" class="modal-backdrop" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close-modal aria-label="ปิด">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="floating-auth">
    <button id="loginButton" class="auth-pill-button" type="button">ล็อกอิน</button>
    <button id="logoutButton" class="auth-pill-button" type="button" hidden>ออกจากระบบ</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
